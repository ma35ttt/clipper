[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.8.1"
description = "Realtime livestream clip machine — rolling buffer, chat + audio triggers, vertical exports"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]
